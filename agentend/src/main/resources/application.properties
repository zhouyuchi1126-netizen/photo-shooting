server.port=8082

# =============================================
# AI 模型配置（OpenAI 兼容接口）
# 默认对接 DeepSeek，也可切换为 OpenAI / Ollama
# =============================================
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.7

# =============================================
# 流式响应
# =============================================
spring.ai.openai.chat.options.stream=true

# =============================================
# Ollama 本地模型（取消注释即可切换）
# =============================================
# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=llama3

# =============================================
# PostgreSQL + PGVector（RAG 知识库用）
# 后续启用 RAG 时取消注释
# =============================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/photography_rag
# spring.datasource.username=postgres
# spring.datasource.password=${PG_PASSWORD}

# =============================================
# 日志
# =============================================
logging.level.com.photography.agent=DEBUG
logging.level.org.springframework.ai=INFO
