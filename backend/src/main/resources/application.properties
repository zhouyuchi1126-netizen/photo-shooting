server.port=8081

# ===========================================
# CORS 允许的前端域名，逗号分隔（生产环境加上你的域名）
# ===========================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# ===========================================
# 本地图片存储路径（开发 / 未配置 OSS 时默认使用）
# ===========================================
app.storage.local.path=images

# 文件上传大小限制（覆盖 Spring Boot 默认 1MB）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.datasource.url=jdbc:mysql://localhost:3306/photoshooting?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=photouser
spring.datasource.password=zHoujiale1991.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml

# SQLite Configuration is kept for compatibility
# spring.datasource.url=jdbc:sqlite:photo_shooting.db
# spring.datasource.driver-class-name=org.sqlite.JDBC

# ===========================================
# 图片防盗链：允许引用的域名，逗号分隔（生产环境改为你的域名）
# ===========================================
app.anti-leech.domains=*

# ===========================================
# 图片存储方式：local（默认/开发） | oss（生产）
# ===========================================
app.storage.type=local

# 阿里云 OSS 配置（仅 app.storage.type=oss 时需要）
app.storage.oss.endpoint=https://oss-cn-hangzhou.aliyuncs.com
app.storage.oss.access-key-id=你的AccessKeyID
app.storage.oss.access-key-secret=你的AccessKeySecret
app.storage.oss.bucket-name=你的Bucket名称
app.storage.oss.domain=https://你的Bucket名称.oss-cn-hangzhou.aliyuncs.com

